_base_: stage5_lego_gsplat.yaml
name: stage5_lego_gsplat_densify

model:
  n: 100000                 # 3DGS NeRF-synthetic init: 100k uniform points in [-1.3, 1.3]^3
  scale_factor: 0.7         # ~ mean distance to the 3 nearest neighbours of uniform points

densify:
  strategy: gsplat_default  # 3DGS adaptive density control, gsplat's implementation (reference)
  verbose: false            # all other parameters at gsplat defaults (= 3DGS paper)
